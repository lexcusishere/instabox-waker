name: instabox waker

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch: {}

concurrency:
  group: instabox-waker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  waker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Wake + jaring pengaman cycler (430m)
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: m_agqz5d4cjfox6el7fnwmwpcztq
        run: |
          set -e
          # PEMBAGIAN PERAN (penting):
          #   * CYCLER UTAMA : Google Apps Script (google-apps-script/Code.gs),
          #     trigger tiap 5 menit, cycle di menit 420. Itu yang menjaga max-run.
          #   * JOB INI      : wake kalau sandbox pause + JARING PENGAMAN.
          #     Ambang 430 dipilih supaya:
          #       - normalnya TIDAK PERNAH kena, karena Apps Script sudah cycle di 420
          #         (window di-reset, umur run kembali ~0);
          #       - kalau Apps Script mati/di-nonaktifkan, job ini tetap menyelamatkan
          #         box sebelum max-run 480 (jadi tidak perlu cooldown 5-120 menit).
          # Kalau Apps Script terbukti andal beberapa hari dan kamu mau job ini
          # benar-benar pasif, ubah 430 -> 0 (wake-only murni).
          python3 external-waker.py --machine "$MACHINE_ID" --once --safe-minutes 430

      - name: Pastikan sandbox kembali running (self-healing)
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: m_agqz5d4cjfox6el7fnwmwpcztq
        run: |
          set -e
          for i in $(seq 1 18); do
            body=$(curl -sS -m 20 -H "X-API-Key: $INSTABOX_API_KEY" "https://api.instabox.sh/v1/machines/$MACHINE_ID" || true)
            st=$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("state",""))' 2>/dev/null || true)
            echo "percobaan $i: state=$st"
            if [ "$st" = "running" ]; then
              printf '%s' "$body" | python3 -c 'import sys,json,datetime;m=json.load(sys.stdin);rs=m.get("runStartedAt");run=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(rs.replace("Z","+00:00"))).total_seconds()/60 if rs else -1;print("OK running=%.0f menit dari %s menit, cooldownUntil=%s" % (run, m.get("maxRunMinutes"), m.get("cooldownUntil")))' 2>/dev/null || true
              exit 0
            fi
            case "$st" in
              suspended|paused|stopped)
                echo "  -> mengirim resume"
                curl -sS -m 45 -X POST -H "X-API-Key: $INSTABOX_API_KEY" -H "Content-Type: application/json" -H "Idempotency-Key: gh-waker-$GITHUB_RUN_ID-$i" -d '{}' "https://api.instabox.sh/v1/machines/$MACHINE_ID/resume" || true
                ;;
            esac
            sleep 10
          done
          echo "PERINGATAN: belum running setelah 18 percobaan - cek dashboard instabox"
          exit 0

  heartbeat:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Jaga scheduled workflow tetap aktif
        run: |
          set -e
          if [ -f heartbeat.txt ]; then
            age=$(( ( $(date +%s) - $(date -r heartbeat.txt +%s) ) / 86400 ))
          else
            age=999
          fi
          if [ "$age" -lt 20 ]; then
            echo "heartbeat masih muda ($age hari)"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ run=$GITHUB_RUN_ID" > heartbeat.txt
          git config user.name  "instabox-waker-bot"
          git config user.email "waker-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat: jaga scheduled workflow tetap aktif"
          git push
