name: instabox waker

on:
  schedule:
    # JANGAN di menit :00 — awal jam adalah puncak beban GitHub Actions dan
    # schedule di menit itu paling sering telat/di-drop.
    # Dua entri tiap 5 menit (offset 2 dan 4) = 24 kesempatan/jam. GitHub
    # membatasi minimum 5 menit; beberapa entri menambah peluang kalau satu
    # jadwal telat atau dilewati.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch: {}

# Satu putaran saja pada satu waktu; jangan saling membatalkan.
concurrency:
  group: instabox-waker
  cancel-in-progress: false

permissions:
  contents: write   # hanya dipakai job heartbeat (cegah auto-disable 60 hari)

jobs:
  waker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Cek sandbox (wake kalau pause, cycle di menit 420)
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: m_CHANGEME
        run: |
          set -e
          python3 external-waker.py --machine "$MACHINE_ID" --once --safe-minutes 420

  # Repo publik: workflow schedule otomatis dimatikan GitHub setelah 60 hari
  # tanpa aktivitas repo. Commit berkala ini menjaga jadwal tetap hidup.
  heartbeat:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat (aktivitas repo)
        run: |
          set -e
          if [ -f heartbeat.txt ]; then
            age=$(( ( $(date +%s) - $(date -r heartbeat.txt +%s) ) / 86400 ))
          else
            age=999
          fi
          echo "umur heartbeat: ${age} hari"
          if [ "$age" -lt 20 ]; then
            echo "masih muda, tidak perlu commit"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ run=$GITHUB_RUN_ID" > heartbeat.txt
          git config user.name  "instabox-waker-bot"
          git config user.email "waker-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat: jaga scheduled workflow tetap aktif"
          git push