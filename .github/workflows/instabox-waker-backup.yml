name: instabox waker backup

# JARING PENGAMAN KEDUA (independen dari instabox-waker-chain).
# Kenapa ada: kalau job rantai utama mati tepat setelah GitHub melewatkan cron
# (terukur: cron schedule bisa bolong sampai 475 menit), tidak ada lagi yang
# menjaga box. Job ini punya timer sendiri (5 menit) dan hidup terus.
#
# 2026-11-06: maxRun free plan 480 -> 120 menit. Ambang kini adaptif:
# --safe-minutes auto --margin 20 = maxRun - 20. Dengan maxRun 120 -> 100,
# yaitu 10 menit SESUDAH ambang rantai utama (90). Normalnya tidak pernah kena,
# karena rantai utama sudah reset window di menit 90. Kalau rantai mati, job ini
# menyelamatkan box 20 menit sebelum max-run.
#
# ATURAN: hanya SATU yang men-dispatch dirinya sendiri per concurrency group.
# Group sengaja dibedakan supaya keduanya bisa hidup bersamaan.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "9,19,29,39,49,59 * * * *"   # bootstrap saja (kalau rantai putus)

concurrency:
  group: instabox-waker-backup
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Loop 68 x 5 menit (cycle di maxRun-20, di belakang rantai utama)
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_IDS: ${{ vars.INSTABOX_MACHINE_IDS }}
        run: |
          set -u
          IDS_RAW="${MACHINE_IDS:-}"
          if [ -z "$IDS_RAW" ]; then echo "MACHINE_IDS kosong - isi repo variable INSTABOX_MACHINE_IDS"; exit 1; fi
          echo "daftar mesin: $IDS_RAW"
          for i in $(seq 1 68); do
            echo "=== backup iterasi $i/68 $(date -u +%FT%TZ) ==="
            IFS=',' read -ra IDS <<< "$IDS_RAW"
            for MID in "${IDS[@]}"; do
              MID="$(printf '%s' "$MID" | tr -d '[:space:]')"
              [ -n "$MID" ] || continue
              echo "--- mesin $MID ---"
              python3 external-waker.py --machine "$MID" --once --safe-minutes auto --margin 20 || echo "waker $MID exit $?"
            done
            if [ "$i" -lt 68 ]; then sleep 300; fi
          done

      - name: Dispatch putaran backup berikutnya
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          for t in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/instabox-waker-backup.yml/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\"}")
            echo "dispatch percobaan $t -> $code"
            if [ "$code" = "204" ]; then exit 0; fi
            sleep 15
          done
          echo "GAGAL dispatch putaran backup berikutnya"; cat /tmp/d.json || true; exit 1
