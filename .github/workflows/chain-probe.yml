name: chain probe
# Uji apakah GITHUB_TOKEN (bukan PAT) boleh men-dispatch workflow lain.
# Hanya untuk validasi; aman diulang.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch instabox-waker.yml pakai GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          echo "repo=${{ github.repository }}"
          code=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/instabox-waker.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch code=$code"
          cat /tmp/d.json || true
          echo "PROBE_RESULT=$code"
