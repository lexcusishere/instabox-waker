name: instabox waker chain

# CYLER UTAMA (rantai berkesinambungan).
# Kenapa bukan cron: schedule GitHub terbukti drop job (terukur 8 run / 21 jam,
# 2026-11-06: maxRunMinutes free plan berubah 480 -> 120 menit (terukur: box
# kena suspend trigger=max_run pada umur run 120,6 menit; API mesin
# "maxRunMinutes": 120). Karena itu ambang TIDAK di-hardcode: --safe-minutes
# auto = maxRunMinutes - margin, dibaca ulang dari API tiap iterasi.
# margin 30 -> cycle di menit 90 (buffer 30 menit sebelum max-run).
# Kalau plan berubah lagi (240/480/unlimited) file ini tidak perlu diedit.
# Jaring pengaman: instabox-waker-backup.yml (auto, margin 20 -> 100m).

on:
  workflow_dispatch: {}
  schedule:
    # bootstrap: kalau rantai mati, cron ini menghidupkannya lagi.
    - cron: "6,16,26,36,46,56 * * * *"

concurrency:
  group: instabox-waker-chain
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # untuk dispatch putaran berikutnya

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Loop 68 x 5 menit (cycle di maxRun - margin)
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: ${{ vars.INSTABOX_MACHINE_ID }}
        run: |
          set -u
          for i in $(seq 1 68); do
            echo "=== iterasi $i/68 $(date -u +%FT%TZ) ==="
            python3 external-waker.py --machine "$MACHINE_ID" --once --safe-minutes auto --margin 30 || echo "waker exit $?"
            if [ "$i" -lt 68 ]; then sleep 300; fi
          done

      - name: Dispatch putaran berikutnya
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          for t in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/instabox-waker-chain.yml/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\"}")
            echo "dispatch percobaan $t -> $code"
            if [ "$code" = "204" ]; then exit 0; fi
            sleep 15
          done
          echo "GAGAL dispatch putaran berikutnya"; cat /tmp/d.json || true; exit 1
